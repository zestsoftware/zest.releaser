name: tests
on:
  push:
    branches: [ master ]
  pull_request:
  schedule:
    - cron: '13 7 * * 0'  # run once a week on Sunday
  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        config:
        # [Python version, tox env, runner]
        - ["3.9",      "py39",    "ubuntu-24.04"]
        - ["3.10",     "py310",   "ubuntu-latest"]
        - ["3.11",     "py311",   "ubuntu-latest"]
        - ["3.12",     "py312",   "ubuntu-latest"]
        - ["3.13",     "py313",   "ubuntu-latest"]
        - ["3.14",     "py314",   "ubuntu-latest"]
        - ["3.15",     "py315",   "ubuntu-latest"]
        - ["pypy3.11", "pypy311", "ubuntu-latest"]

    runs-on: ${{ matrix.config[2] }}
    name: ${{ matrix.config[1] }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.config[0] }}
        cache: 'pip'
        cache-dependency-path: |
          setup.*
          tox.ini

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Test
      run: tox -e ${{ matrix.config[1] }}
